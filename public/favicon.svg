<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    :root {
      --bg: #1d4ed8;
      --border: #b45309;
      --text: #ffffff;
      --halo: rgba(255, 255, 255, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --border: #f59e0b;
        --text: #60a5fa;
        --halo: rgba(59, 130, 246, 0.2);
      }
    }
  </style>
  <rect width="128" height="128" rx="28" fill="var(--bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="var(--border)" stroke-width="3.5" opacity="0.6"/>
  <circle cx="64" cy="64" r="42" fill="var(--halo)"/>
  <text x="64" y="82" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="58" font-weight="700" text-anchor="middle" fill="var(--text)" letter-spacing="1">BA</text>
</svg>
